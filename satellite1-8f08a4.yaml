## ============================================================================
## Satellite1 8f08a4 — Full configuration
## ============================================================================
## FLATTENED structure: fetches every config/common/*.yaml file directly from
## negoti8za/Satellite1-ESPHome (fork of FutureProofHomes/Satellite1-ESPHome)
## via a single-level remote git `files:` package list, and inlines
## satellite1.base.yaml's own top-level keys (globals, esphome, ota, fusb302b,
## http_request, safe_mode, status_led, satellite1, memory_flasher) directly
## below instead of fetching that file.
##
## WHY: ESPHome's remote git `files:` package method only fetches the exact
## files listed - it does NOT reliably resolve a second level of nested
## `!include`/`packages:` inside those fetched files (confirmed: fetching
## satellite1.base.yaml, which itself has `packages: core_board: !include
## common/core_board.yaml`, caused "Platform missing" because core_board.yaml
## was never actually pulled in). Flattening to one level avoids this
## entirely, while still needing no local file copies (works regardless of
## the ESPHome dashboard's working directory).
## ============================================================================

substitutions:
  # Device identity
  node_name: satellite1-8f08a4
  friendly_name: "Satellite1 8f08a4"
  company_name: FutureProofHomes
  project_name: Satellite1
  component_name: Core
  esp32_fw_version: dev
  xmos_fw_version: "v1.0.3"

  # Sensor calibration (AHT20 temp/humidity, standard on the Hat board)
  temp_offset: "-3"
  humidity_offset: "5"

  # OPTIONALLY, set the log level to debug, info, warn, error
  log_level: debug

globals:
  # Global initialisation variable. Initialized to true and set to false once everything is connected.
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing if user action causes warning
  - id: warning
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the XMOS flasher status.
  - id: xmos_flashing_state
    type: int
    restore_value: no
    initial_value: '0'
  # Global variable tracking the USB-PD contract voltage.
  - id: pd_power_contract
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

  on_boot:
    - priority: -100
      then:
        - logger.log: "${company_name} ${project_name} ${component_name} running ESP firmware: ${esp32_fw_version} and XMOS firmware: ${xmos_fw_version}"
        - script.execute: control_leds
        - delay: 1s

        # if line_out was used previously but is not available try speaker
        - lambda: |
            if( !id(line_out_sensor).state && id(dac_proxy).active_dac == 1){
              id(dac_proxy).activate_speaker();
            }

        # If after 10 minutes, the device is still initializing, turn off init_in_progress and refresh LEDs
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds

logger:
  level: ${log_level}

ota:
  - platform: esphome
    id: ota_esphome

packages:
  FutureProofHomes.Satellite1:
    url: &repo_url "https://github.com/negoti8za/Satellite1-ESPHome"
    ref: &repo_ref "staging"
    refresh: 10s
    files:
      # Flattened: every common/*.yaml pulled directly (no nested packages)
      - config/common/core_board.yaml
      - config/common/wifi_improv.yaml
      - config/common/hat_sensors.yaml
      - config/common/buttons.yaml
      - config/common/home_assistant.yaml
      - config/common/speaker.yaml
      - config/common/media_player.yaml
      - config/common/voice_assistant.yaml
      - config/common/timer.yaml
      - config/common/led_ring.yaml
      - config/common/mmwave.yaml
      - config/common/sendspin.yaml
      - config/common/dashboard_build.yaml
      - path: config/common/components.external.yaml
        vars:
          ext_comp_repo_url: *repo_url
          ext_comp_repo_ref: *repo_ref

      ## OPTIONALLY, uncomment for extra memory/wifi/xmos control diagnostics
      # - config/common/debug.yaml
      # - config/common/developer.yaml

fusb302b:
  id: pd_fusb302b
  irq_pin: GPIO1
  request_voltage: 20
  on_power_ready:
    then:
      - logger.log:
          format: "PD contract got accepted: %s"
          args: ['id(pd_fusb302b).contract.c_str()']
      - text_sensor.template.publish:
          id: pd_state_text
          state: !lambda 'return id(pd_fusb302b).contract;'
      - lambda: id(pd_power_contract) = id(pd_fusb302b).contract_voltage;
      - script.execute: tas2780_ensure_active

http_request:

safe_mode:

status_led:
  pin:
    number: GPIO45
    ignore_strapping_warning: true

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

  on_xmos_no_response:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

  on_xmos_connected:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

memory_flasher:
  - platform: satellite1
    id: xflash
    embed_flash_image:
      image_version: ${xmos_fw_version}
      image_file: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.bin
      md5_file: https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.md5

    on_flashing_start:
      then:
        - lambda: id(xmos_flashing_state) = 1;
        - script.execute: control_leds

    on_progress_update:
      then:
        - lambda: id(global_led_animation_index) = id(xflash).flashing_progress * 24 / 100;
        - script.execute: control_leds

    on_flashing_success:
      then:
        - logger.log: "success called"
        - lambda: id(xmos_flashing_state) = 2;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        - if:
            condition:
              lambda: |-
                return id(pd_fusb302b).contract_voltage >= 9;
            then:
              - tas2780.activate:
                  mode: 2
            else:
              - tas2780.activate:
                  mode: 0

    on_flashing_failed:
      then:
        - logger.log: "failed called"
        - lambda: id(xmos_flashing_state) = 3;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;

    on_erasing_done:
      then:
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button

## OPTIONALLY, enable transport encryption for the API layer by uncommenting the following lines
## and replacing "REPLACE_BY_32_BIT_RANDOM_KEY" with a 32-character random key.
## https://esphome.io/components/api.html

# api:
#   encryption:
#     key: !secret api_encryption_key

## OPTIONALLY, override the default Wi-Fi credentials provisioned on the Satellite1 device
## by using your Wi-Fi credentials stored in the `secrets.yaml` file of the ESPHome dashboard.

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

## Device (10.10.50.x) and the HA/ESPHome build server (10.10.100.x) are on different
## subnets, so mDNS discovery for OTA doesn't cross that boundary ("No devices matching
## '<name>-<mac>.local' were discovered"). Setting use_address targets the known IP
## directly instead, bypassing mDNS discovery for OTA uploads.
wifi:
  use_address: 10.10.50.47

## ============================================================================
## Voice detection tuning — overrides the defaults from common/voice_assistant.yaml
## ============================================================================
voice_assistant:
  use_wake_word: true
  noise_suppression_level: 2
  auto_gain: 5 dbfs
  volume_multiplier: 1.0
  microphone:
    channels: 1
